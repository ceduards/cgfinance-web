<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CG Finance · Contabilidad y CRM</title>
<style>
:root{
  --navy:#16274f;--navy-2:#1d3568;--navy-deep:#0f1c3b;--gold:#d6a23e;--gold-2:#e4b552;
  --bg:#f3f5fa;--card:#fff;--ink:#1a2340;--muted:#5c6579;--line:#dfe3ec;--line2:#eef0f5;
  --ok:#1e8a4c;--okbg:#e3f5ea;--warn:#a86b00;--warnbg:#fff3d6;--bad:#c0392b;--badbg:#fde8e5;--info:#2456a6;--infobg:#e6eefc;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;line-height:1.2}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;min-height:56px;border-bottom:2px solid var(--gold);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;font-weight:700;font-size:1.1rem;white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:6px;background:var(--gold);color:var(--navy-deep);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.brand small{display:block;font-family:system-ui,sans-serif;font-size:.62rem;font-weight:600;letter-spacing:.12em;color:#cfd6e8;text-transform:uppercase}
.spacer{flex:1}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:default;white-space:nowrap}
.chip.ok{background:#164a2f;border-color:#2c8a57;color:#c9f3da}
.chip.warn{background:#7a5200;border-color:#e0a635;color:#fff0c7;cursor:pointer}
.chip.bad{background:#7d2519;border-color:#e0705f;color:#ffe1dc;cursor:pointer}
.chip.quiet{background:transparent;border-color:rgba(255,255,255,.3);color:#dfe5f4;cursor:pointer}
.chip button{background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit;font-weight:600;padding:0 0 0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:.92rem;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f0f3fa;border-color:#c7cfdf}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy-deep)}
.btn.pri:hover{background:var(--gold-2)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{background:var(--navy-2)}
.btn.bad{color:var(--bad);border-color:#f0c2bc}
.btn.bad:hover{background:var(--badbg)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:.82rem}
.btn.ghost-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.btn.ghost-w:hover{background:rgba(255,255,255,.12)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 58px)}
nav#nav{background:#fff;border-right:1px solid var(--line);padding:12px 10px;position:sticky;top:58px;align-self:start;height:calc(100vh - 58px);overflow:auto}
nav#nav .grp{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
nav#nav a{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:9px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer;min-height:40px}
nav#nav a:hover{background:var(--bg)}
nav#nav a.on{background:var(--navy);color:#fff}
nav#nav .badge{background:var(--bad);color:#fff;border-radius:99px;font-size:.72rem;font-weight:700;padding:1px 7px}
nav#nav .aviso{font-size:.72rem;color:var(--muted);padding:12px 10px;border-top:1px solid var(--line2);margin-top:12px;line-height:1.35}
main#main{padding:22px 26px 60px;min-width:0}
.pagehead{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.pagehead p{color:var(--muted);font-size:.9rem;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .l{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:Georgia,serif;font-size:1.55rem;font-weight:700;margin-top:4px}
.kpi .s{font-size:.8rem;color:var(--muted);margin-top:2px}
.banner{background:var(--warnbg);border-bottom:1px solid #ecd08a;color:#5c4200;padding:10px 22px;display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.banner.info{background:var(--infobg);border-color:#bcd0f3;color:#1d3f7a}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters .f{display:flex;flex-direction:column;gap:3px}
label.lbl,.f>label{font-size:.76rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;min-height:38px;padding:7px 10px;border:1px solid #c9d0de;border-radius:6px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy)}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.filters input,.filters select{width:auto;min-width:130px}
.filters input[type=search]{min-width:220px}
.filters input[type=checkbox]{min-width:0;width:18px}
table.lin th:nth-child(3){min-width:170px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}
table.t th{background:#f6f7fb;text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:#f8f9fd}
table.t .r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.tot td{font-weight:700;background:#f6f7fb;border-top:2px solid var(--line)}
table.t tr.sub td{font-weight:600;background:#fafbfd}
table.t tr.cls td{font-weight:700;background:#eef1f8}
table.t tr.muted td{color:var(--muted)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.tag{align-self:flex-start;flex:none;display:inline-block;border-radius:99px;padding:1px 9px;font-size:.74rem;font-weight:700;background:var(--line2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.info{background:var(--infobg);color:var(--info)}
.muted{color:var(--muted)}.small{font-size:.82rem}.right{text-align:right}.mt{margin-top:14px}.mb{margin-bottom:14px}
.neg{color:var(--bad)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;min-height:40px}
.tabs button.on{color:var(--navy);border-color:var(--gold)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:#e9edf5;border-radius:var(--radius);padding:10px;min-height:260px}
.col.over{outline:2px dashed var(--gold)}
.col h3{display:flex;justify-content:space-between;align-items:baseline;font-family:system-ui,sans-serif;font-size:.86rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.col .sum{font-size:.78rem;color:var(--muted);margin-bottom:8px}
.opp{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(15,28,59,.06)}
.opp .ti{font-weight:700;font-size:.92rem}.opp .te{font-size:.82rem;color:var(--muted)}
.opp .va{font-weight:700;margin-top:4px}
.opp .meta{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;font-size:.76rem}
.opp .row{display:flex;gap:6px;align-items:center;margin-top:6px}
.opp select{min-height:30px;padding:2px 6px;font-size:.8rem}
.stale{border-left:4px solid var(--warn)}
.funnel .bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.funnel .name{width:140px;font-size:.86rem;font-weight:600}
.funnel .track{flex:1;background:var(--line2);border-radius:5px;height:28px;position:relative}
.funnel .fill{height:100%;border-radius:5px;background:var(--navy);min-width:3px}
.funnel .val{width:200px;font-size:.84rem;text-align:right}
/* dialog */
dialog{border:none;border-radius:12px;padding:0;max-width:calc(100vw - 24px);width:560px;box-shadow:0 20px 60px rgba(10,20,50,.35);background:#fff;color:var(--ink)}
dialog.wide{width:1040px}dialog.mid{width:760px}
dialog::backdrop{background:rgba(15,28,59,.5)}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;border-radius:12px 12px 0 0}
.dbody{padding:18px 20px;max-height:calc(100vh - 190px);overflow:auto}
.dfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 12px 12px}
.x{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1;padding:4px 8px}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(6,minmax(0,1fr))}
.fgrid .f{display:flex;flex-direction:column;gap:3px;grid-column:span 3}
.fgrid .f.s2{grid-column:span 2}.fgrid .f.s4{grid-column:span 4}.fgrid .f.s6{grid-column:span 6}
.err{background:var(--badbg);border:1px solid #f0c2bc;color:var(--bad);padding:8px 12px;border-radius:6px;margin-top:10px;font-size:.88rem}
.err ul{margin-left:18px}
.notice{background:var(--infobg);border:1px solid #bcd0f3;color:#1d3f7a;padding:9px 12px;border-radius:6px;font-size:.84rem}
.notice.warn{background:var(--warnbg);border-color:#ecd08a;color:#5c4200}
.wizard{background:#fbf7ec;border:1px solid #ecdcae;border-radius:8px;padding:12px;margin:12px 0}
.wizard .wrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.wizard .f{display:flex;flex-direction:column;gap:3px}
.wizard .inl{display:flex;gap:6px;align-items:center;min-height:38px}
.wizard input.pct{width:70px}
table.lin{width:100%;border-collapse:collapse}
table.lin th{font-size:.72rem;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 4px}
table.lin td{padding:3px 3px}
table.lin td.acc{white-space:nowrap;width:78px}
table.lin td.acc button{border:1px solid var(--line);background:#fff;border-radius:5px;min-width:32px;min-height:32px;cursor:pointer}
.totales{display:flex;gap:18px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:8px;font-variant-numeric:tabular-nums;font-weight:600}
.cuadre{padding:3px 12px;border-radius:99px;font-size:.82rem}
.cuadre.ok{background:var(--okbg);color:var(--ok)}.cuadre.bad{background:var(--badbg);color:var(--bad)}
.fecha-wrap{position:relative;display:block}
.fecha-wrap input.fecha{padding-right:38px}
.fecha-wrap .cal{position:absolute;right:2px;top:2px;height:34px;width:34px;border:none;background:none;cursor:pointer;font-size:1rem}
.fecha-wrap .calh{position:absolute;right:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--navy-deep);color:#fff;padding:10px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.9rem;max-width:90vw}
.toast.err2{background:var(--bad)}.toast.ok2{background:var(--ok)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sel{background:#fff6dc !important;outline:2px solid var(--gold);outline-offset:-2px}
.done td{color:#8a93a6}
.timeline .it{padding:8px 0;border-bottom:1px solid var(--line2)}
.timeline .it:last-child{border:none}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted);font-weight:600}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}
.print-title{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  nav#nav{position:static;height:auto;display:flex;flex-wrap:nowrap;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:6px 8px;gap:2px;top:auto}
  nav#nav .grp,nav#nav .aviso{display:none}
  nav#nav a{white-space:nowrap;flex:none}
  main#main{padding:16px 14px 50px}
  .g2,.g3,.g4,.split{grid-template-columns:1fr}
  .funnel .name{width:100px}.funnel .val{width:130px;font-size:.76rem}
}
@media (max-width:640px){.fgrid .f,.fgrid .f.s2,.fgrid .f.s4{grid-column:span 6}.filters input,.filters select{min-width:0;width:100%}.filters .f{flex:1 1 140px}}
table.lin{min-width:780px}
.linwrap{overflow-x:auto}
@media print{
  .topbar,nav#nav,#banner,.actions,.filters,.tabs,.no-print,#toasts{display:none !important}
  .shell{display:block}main#main{padding:0}body{background:#fff}
  .card{border:none;padding:0}.print-title{display:block;margin-bottom:10px}
  .tablewrap{border:none;overflow:visible}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">CG</div><div>CG Finance S.A.S.<small>Contabilidad y CRM</small></div></div>
  <div class="spacer"></div>
  <div class="top-actions">
    <span id="estado-respaldo"></span>
    <button class="btn ghost-w sm" data-act="exportar-json" title="Descargar todos los datos en un archivo JSON">Exportar JSON</button>
    <button class="btn ghost-w sm" data-act="importar-json" title="Cargar un archivo JSON de respaldo">Importar JSON</button>
  </div>
</header>
<div id="banner"></div>
<div class="shell">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<datalist id="dl-cuentas"></datalist>
<datalist id="dl-terceros"></datalist>
<datalist id="dl-servicios"></datalist>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="toasts"></div>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<input type="file" id="file-csv" accept=".csv,.txt,text/csv" hidden>
<script>
'use strict';
/* =====================================================================
   CG FINANCE S.A.S. — Contabilidad y CRM (aplicación autocontenida)
   Solución puente hasta migrar a Xubio. Sin servidor, sin dependencias.
   Esta aplicación NO emite facturas electrónicas: las facturas se emiten
   en el portal gratuito de la DIAN y aquí solo se registra el asiento.
   ===================================================================== */

/* ---------------------------------------------------------------------
   ▼▼▼  CONEXIÓN DIRECTA CON MICROSOFT ONEDRIVE (DESACTIVADA)  ▼▼▼
   Para activarla: registre una aplicación en Azure (Microsoft Entra ID →
   Registros de aplicaciones), tipo "Aplicación de página única (SPA)",
   agregue como URI de redirección la dirección https donde publique este
   archivo, permisos delegados de Microsoft Graph: Files.ReadWrite y
   offline_access. Luego pegue aquí el "Id. de aplicación (cliente)".
   Mientras esté vacío, la conexión permanece desactivada; al pegarlo se
   activa sola (OAuth 2.0 con PKCE + Microsoft Graph).
   --------------------------------------------------------------------- */
const ONEDRIVE_CLIENT_ID = '';   // ← PEGUE AQUÍ EL IDENTIFICADOR DE CLIENTE DE AZURE
const ONEDRIVE_CARPETA   = 'CG Finance/Respaldos';  // carpeta dentro de OneDrive
/* ▲▲▲ ------------------------------------------------------------- ▲▲▲ */

const VERSION_DATOS = 1;
const CATALOGO_VERSION = 'xubio-1';
const MAX_RESPALDOS_FECHA = 30;
const ESPERA_RESPALDO_MS = 2000;

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const p2 = n => String(n).padStart(2, '0');
const isoDe = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const hoy = () => isoDe(new Date());
const partesISO = s => s.split('-').map(Number);
function sumarDias(iso, n) { const [y, m, d] = partesISO(iso); return isoDe(new Date(y, m - 1, d + n)); }
function diasEntre(a, b) { const f = s => { const [y, m, d] = partesISO(s); return Date.UTC(y, m - 1, d); }; return Math.round((f(b) - f(a)) / 864e5); }
const fmtFecha = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
function fechaValida(y, m, d) { const dt = new Date(y, m - 1, d); return (dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d) ? `${y}-${p2(m)}-${p2(d)}` : null; }
function parseFecha(s) {
  s = String(s || '').trim(); let m;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/))) { let y = +m[3]; if (y < 100) y += 2000; return fechaValida(y, +m[2], +m[1]); }
  if ((m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))) return fechaValida(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return fechaValida(+m[1], +m[2], +m[3]);
  return null;
}
const agrupar = n => String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fmtNum = n => { n = Math.round(n || 0); return (n < 0 ? '-' : '') + agrupar(n); };
const fmt = n => { n = Math.round(n || 0); return (n < 0 ? '-' : '') + '$ ' + agrupar(n); };
const cls = n => n < 0 ? ' neg' : '';
function parseCOP(s) {
  s = String(s ?? '').trim(); if (!s) return 0;
  const neg = /^-|\(.*\)/.test(s);
  s = s.replace(/[^\d,]/g, '');
  if (s.includes(',')) s = s.replace(',', '.');
  const n = Math.round(parseFloat(s) || 0);
  return neg ? -n : n;
}
const pct = n => (Math.round(n * 100) / 100).toString().replace('.', ',') + '%';
function toast(msg, tipo) {
  const t = document.createElement('div'); t.className = 'toast ' + (tipo === 'error' ? 'err2' : tipo === 'ok' ? 'ok2' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), tipo === 'error' ? 6000 : 3200);
}
function descargar(nombre, contenido, mime) {
  const blob = new Blob([contenido], { type: mime || 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* Dígito de verificación DIAN (módulo 11) */
function calcularDV(nit) {
  nit = String(nit || '').replace(/\D/g, ''); if (!nit) return '';
  const pr = [3, 7, 13, 17, 19, 23, 29, 37, 41, 43, 47, 53, 59, 67, 71];
  let s = 0; const d = nit.split('').reverse();
  for (let i = 0; i < d.length && i < pr.length; i++) s += +d[i] * pr[i];
  const r = s % 11; return String(r > 1 ? 11 - r : r);
}

const CUENTA_EQUIV = { 240801: '240805', 240802: '240810', 236701: '2367', 236801: '2368' };
function migrarCatalogo(r) {
  const nuevo = construirCuentas(), cod = new Set(nuevo.map(c => c.codigo));
  const usadas = new Set((r.asientos || []).flatMap(a => (a.lineas || []).map(l => l.cuenta)));
  const mapa = c => cod.has(c) ? c : CUENTA_EQUIV[c] || (cod.has(c.slice(0, 4)) ? c.slice(0, 4) : c);
  for (const a of r.asientos || []) for (const l of a.lineas || []) l.cuenta = mapa(l.cuenta);
  for (const x of r.extractos || []) x.cuenta = mapa(x.cuenta);
  const viejos = new Map((r.cuentas || []).map(c => [c.codigo, c]));
  const extra = [...usadas].map(mapa).filter(c => !cod.has(c) && viejos.has(c)).map(c => viejos.get(c));
  for (const c of (r.cuentas || [])) if (!cod.has(c.codigo) && c.personalizada) extra.push(c);
  r.cuentas = nuevo.concat(extra.filter((c, i, a) => a.findIndex(z => z.codigo === c.codigo) === i));
  const auto = dbVacia().config.cuentasAuto, ca = (r.config && r.config.cuentasAuto) || {};
  for (const k of Object.keys(auto)) ca[k] = cod.has(mapa(ca[k] || '')) ? mapa(ca[k]) : auto[k];
  if (r.config) r.config.cuentasAuto = ca;
  r.catalogo = CATALOGO_VERSION;
}
function normalizar(o) {
  if (!o || typeof o !== 'object' || o.app !== 'cgfinance') throw new Error('El archivo no es un respaldo de CG Finance.');
  const base = dbVacia();

  r.config = Object.assign(base.config, o.config || {});
  r.config.empresa = Object.assign({ nombre: 'CG Finance S.A.S.', nit: '' }, (o.config || {}).empresa);
  r.config.cuentasAuto = Object.assign(dbVacia().config.cuentasAuto, (o.config || {}).cuentasAuto);
  r.config.consecutivos = (o.config || {}).consecutivos || {};
  for (const k of ['cuentas', 'terceros', 'asientos', 'oportunidades', 'interacciones', 'tareas', 'extractos']) if (!Array.isArray(r[k])) r[k] = [];
  if (!r.cuentas.length || o.catalogo !== CATALOGO_VERSION) migrarCatalogo(r);
  for (const a of r.asientos) { a.lineas = a.lineas || []; for (const l of a.lineas) { if (!l.id) l.id = uid('l'); l.debito = +l.debito || 0; l.credito = +l.credito || 0; } }
  return r;
}

/* ---------- Persistencia local (IndexedDB con respaldo en localStorage) ---------- */
const IDB = (() => {
  let dbp;
  const abrir = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('cgfinance', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  async function tx(modo, fn) {
    const d = await abrir();
    return new Promise((res, rej) => {
      const t = d.transaction('kv', modo); const r = fn(t.objectStore('kv'));
      t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return { get: k => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)) };
})();
const Almacen = {
  async leer() {
    try { const v = await IDB.get('db'); if (v) return v; } catch (e) { }
    try { const s = localStorage.getItem('cg_db'); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  },
  async escribir(obj) {
    try { await IDB.set('db', obj); return; } catch (e) { }
    try { localStorage.setItem('cg_db', JSON.stringify(obj)); } catch (e) { toast('No se pudo guardar en este navegador. Exporte el JSON ya.', 'error'); }
  },
};

function lineasPlanas() {
  const out = [];
  for (const a of db.asientos) for (const l of a.lineas) out.push({ fecha: a.fecha, asiento: a, linea: l, cuenta: l.cuenta, tercero: l.terceroId || a.terceroId || '', debito: l.debito || 0, credito: l.credito || 0 });
  out.sort((x, y) => x.fecha < y.fecha ? -1 : x.fecha > y.fecha ? 1 : x.asiento.numero < y.asiento.numero ? -1 : x.asiento.numero > y.asiento.numero ? 1 : 0);
  return out;
}
function saldosPorCuenta({ desde, hasta, terceroId } = {}) {
  const m = new Map();
  for (const x of lineasPlanas()) {
    if (hasta && x.fecha > hasta) continue;
    if (terceroId && x.tercero !== terceroId) continue;
    let r = m.get(x.cuenta); if (!r) { r = { codigo: x.cuenta, ini: 0, deb: 0, cred: 0 }; m.set(x.cuenta, r); }
    if (desde && x.fecha < desde) r.ini += x.debito - x.credito; else { r.deb += x.debito; r.cred += x.credito; }
  }
  return m;
}
/* saldo natural (positivo) de una cuenta según su naturaleza */
function saldoCuenta(codigo, hasta) {
  let s = 0; for (const x of lineasPlanas()) if (x.cuenta.startsWith(codigo) && (!hasta || x.fecha <= hasta)) s += x.debito - x.credito; return s;
}

}

const RE_DIA = /^cgfinance-respaldo-\d{4}-\d{2}-\d{2}\.json$/;
const SinkCarpeta = {
  id: 'carpeta', nombre: 'Carpeta', handle: null, estado: 'sin', ultimo: null, error: '',
  soportado: () => 'showDirectoryPicker' in window,
  listo() { return this.handle && this.estado === 'ok'; },
  async guardar(nombre, texto) {
    const fh = await this.handle.getFileHandle(nombre, { create: true });
    const w = await fh.createWritable(); await w.write(texto); await w.close();
  },
  async existe(nombre) { try { await this.handle.getFileHandle(nombre); return true; } catch (e) { if (e.name === 'NotFoundError') return false; throw e; } },
  async listar() { const n = []; for await (const [k, v] of this.handle.entries()) if (v.kind === 'file') n.push(k); return n; },
  async borrar(nombre) { await this.handle.removeEntry(nombre); },
  async leer(nombre) { const fh = await this.handle.getFileHandle(nombre); return (await fh.getFile()).text(); },
};
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const SinkOneDrive = {
  id: 'onedrive', nombre: 'OneDrive', estado: 'sin', ultimo: null, error: '',
  auth: 'https://login.microsoftonline.com/common/oauth2/v2.0',
  graph: 'https://graph.microsoft.com/v1.0',
  scopes: 'Files.ReadWrite offline_access User.Read',
  get activo() { return !!String(ONEDRIVE_CLIENT_ID || '').trim(); },
  redirect() { return location.origin + location.pathname; },
  soportado() { return this.activo && location.protocol.startsWith('http') && !!(window.crypto && crypto.subtle); },
  tokens() { try { return JSON.parse(localStorage.getItem('cg_od_tokens') || 'null'); } catch (e) { return null; } },
  guardarTokens(t) { try { localStorage.setItem('cg_od_tokens', JSON.stringify(t)); } catch (e) { } },
  listo() { return this.activo && !!this.tokens(); },
  async conectar() {
    const a = new Uint8Array(48); crypto.getRandomValues(a); const verifier = b64u(a);
    const challenge = b64u(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
    const st = b64u(crypto.getRandomValues(new Uint8Array(16)));
    sessionStorage.setItem('cg_od_pkce', JSON.stringify({ verifier, st }));
    const q = new URLSearchParams({ client_id: ONEDRIVE_CLIENT_ID.trim(), response_type: 'code', redirect_uri: this.redirect(), response_mode: 'query', scope: this.scopes, code_challenge: challenge, code_challenge_method: 'S256', state: st });
    location.href = this.auth + '/authorize?' + q;
  },
  async completarRetorno() {
    const p = new URLSearchParams(location.search);
    if (!this.activo || !(p.get('code') && p.get('state'))) return;
    let g; try { g = JSON.parse(sessionStorage.getItem('cg_od_pkce') || 'null'); } catch (e) { }
    history.replaceState(null, '', location.pathname + location.hash);
    if (!g || g.st !== p.get('state')) { toast('OneDrive: respuesta de autorización no válida.', 'error'); return; }
    sessionStorage.removeItem('cg_od_pkce');
    try {
      await this.pedirToken({ grant_type: 'authorization_code', code: p.get('code'), redirect_uri: this.redirect(), code_verifier: g.verifier });
      toast('OneDrive conectado.', 'ok');
    } catch (e) { toast('OneDrive: ' + e.message, 'error'); }
  },
  async pedirToken(extra) {
    const r = await fetch(this.auth + '/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(Object.assign({ client_id: ONEDRIVE_CLIENT_ID.trim(), scope: this.scopes }, extra)) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error_description || j.error || 'error de autorización');
    const t = { access: j.access_token, refresh: j.refresh_token || (this.tokens() || {}).refresh, exp: Date.now() + (j.expires_in - 60) * 1000 };
    this.guardarTokens(t); return t;
  },
  async token() {
    let t = this.tokens(); if (!t) throw new Error('OneDrive no está conectado');
    if (Date.now() > t.exp) t = await this.pedirToken({ grant_type: 'refresh_token', refresh_token: t.refresh });
    return t.access;
  },
  desconectar() { localStorage.removeItem('cg_od_tokens'); this.estado = 'sin'; },
  async g(ruta, op = {}) {
    const r = await fetch(this.graph + ruta, Object.assign({}, op, { headers: Object.assign({ Authorization: 'Bearer ' + await this.token() }, op.headers || {}) }));
    return r;
  },
  ruta(nombre) { return '/me/drive/root:/' + ONEDRIVE_CARPETA.split('/').map(encodeURIComponent).join('/') + (nombre ? '/' + encodeURIComponent(nombre) : ''); },
  async guardar(nombre, texto) {
    const bytes = new TextEncoder().encode(texto);
    if (bytes.length < 3.5 * 1024 * 1024) {
      const r = await this.g(this.ruta(nombre) + ':/content', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: bytes });
      if (!r.ok) throw new Error('Graph ' + r.status);
    } else {
      const s = await this.g(this.ruta(nombre) + ':/createUploadSession', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }) });
      if (!s.ok) throw new Error('Graph ' + s.status);
      const { uploadUrl } = await s.json();
      const r = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes 0-${bytes.length - 1}/${bytes.length}` }, body: bytes });
      if (!r.ok) throw new Error('Graph ' + r.status);
    }
  },
  async existe(nombre) { const r = await this.g(this.ruta(nombre)); if (r.status === 404) return false; if (!r.ok) throw new Error('Graph ' + r.status); return true; },
  async listar() { const r = await this.g(this.ruta() + ':/children?$select=name&$top=500'); if (r.status === 404) return []; if (!r.ok) throw new Error('Graph ' + r.status); return (await r.json()).value.map(x => x.name); },
  async borrar(nombre) { await this.g(this.ruta(nombre), { method: 'DELETE' }); },
  async leer(nombre) { const r = await this.g(this.ruta(nombre) + ':/content'); if (!r.ok) throw new Error('Graph ' + r.status); return r.text(); },
};

const Respaldo = {
  timer: null, corriendo: false, repetir: false, pendiente: false,
  sinks() { return [SinkCarpeta, SinkOneDrive].filter(s => s === SinkCarpeta || s.activo); },

    try { const u = localStorage.getItem('cg_ultimo_respaldo'); if (u) SinkCarpeta.ultimo = new Date(u); } catch (e) { }
    if (!SinkCarpeta.soportado()) { SinkCarpeta.estado = 'nosoporta'; }
    else {
      try {
        const h = await IDB.get('dirHandle');
        if (h) { SinkCarpeta.handle = h; SinkCarpeta.estado = (await h.queryPermission({ mode: 'readwrite' })) === 'granted' ? 'ok' : 'permiso'; }
      } catch (e) { }
    }
    await SinkOneDrive.completarRetorno();
    this.pintar();
  },
  programar() { this.pendiente = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.ejecutar(), ESPERA_RESPALDO_MS); this.pintar(); },
  async ahora() { clearTimeout(this.timer); await this.ejecutar(); },
  async ejecutar() {
    if (this.corriendo) { this.repetir = true; return; }
    this.corriendo = true;
    try {
      const texto = JSON.stringify(db, null, 1);
      const nombreDia = `cgfinance-respaldo-${hoy()}.json`;
      for (const s of this.sinks()) {
        if (!s.listo()) continue;
        try {
          if (s === SinkCarpeta && (await s.handle.queryPermission({ mode: 'readwrite' })) !== 'granted') { s.estado = 'permiso'; continue; }
          await s.guardar('cgfinance-actual.json', texto);
          if (!(await s.existe(nombreDia))) { await s.guardar(nombreDia, texto); await this.podar(s); }
          s.ultimo = new Date(); s.error = ''; s.estado = 'ok';
          if (s === SinkCarpeta) try { localStorage.setItem('cg_ultimo_respaldo', s.ultimo.toISOString()); } catch (e) { }
        } catch (e) {
          if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) s.estado = 'permiso';
          else { s.estado = 'error'; s.error = (e && e.message) || String(e); }
        }
      }
    } finally {
      this.corriendo = false; this.pendiente = false;
      if (this.repetir) { this.repetir = false; this.programar(); }
    }
    this.pintar();
  },
  async podar(s) {
    try {
      const fechas = (await s.listar()).filter(n => RE_DIA.test(n)).sort().reverse();

    else h = `<span class="chip ok" title="Carpeta: ${esc(c.handle ? c.handle.name : '')}">${this.pendiente || this.corriendo ? '⟳ Guardando…' : '✓ Respaldo: ' + (c.ultimo ? (c.ultimo.toDateString() === new Date().toDateString() ? 'hoy ' : fmtFecha(isoDe(c.ultimo)) + ' ') + hora(c.ultimo) : 'sin cambios aún')}</span>`;

function confirmar(msg, si, no) {
  return new Promise(res => {
    const d = $('#dlg2'); d.className = '';
    d.innerHTML = `<div class="dbody" style="padding:22px 22px 8px"><p>${esc(msg)}</p></div><div class="dfoot"><button class="btn" data-r="0">${esc(no || 'Cancelar')}</button><button class="btn pri" data-r="1">${esc(si || 'Aceptar')}</button></div>`;
    const fin = v => { d.removeEventListener('click', h); d.removeEventListener('cancel', c); d.close(); res(v); };
    const h = e => { const b = e.target.closest('[data-r]'); if (b) fin(b.dataset.r === '1'); };
    const c = e => { e.preventDefault(); fin(false); };
    d.addEventListener('click', h); d.addEventListener('cancel', c); d.showModal();
  });
}

function resultadoPeriodo(desde, hasta) {
  const m = saldosPorCuenta({ desde, hasta }); let ing = 0, gas = 0;
  for (const r of m.values()) { const net = r.deb - r.cred; if (desde && false) { } if (r.codigo[0] === '4') ing -= net; else if (r.codigo[0] === '5' || r.codigo[0] === '6') gas += net; }
  return { ing, gas, util: ing - gas };
}
function vTablero() {

  const pond = sum(abiertas, o => o.valor * o.probabilidad / 100);

  const maxV = Math.max(1, ...ETAPAS.map(e => sum(ops.filter(o => o.etapa === e.id), o => o.valor)));

    <div class="card kpi"><div class="l">En negociación</div><div class="v">${fmt(vNeg)}</div><div class="s">${ops.filter(o => o.etapa === 'negociacion').length} oportunidad(es)</div></div>

      ${stale.length ? `<div class="timeline mt">${stale.map(o => `<div class="it" style="display:flex;justify-content:space-between;gap:8px;cursor:pointer" data-act="editar-opp" data-id="${o.id}"><span><b>${esc(o.titulo)}</b><br><span class="muted small">${esc(terceroNombre(o.terceroId))} · ${ETAPA[o.etapa].nombre} · ${fmt(o.valor)}</span></span><span class="tag warn">${diasSin(o)} días</span></div>`).join('')}</div>` : '<p class="muted mt">Todas las oportunidades abiertas tienen movimiento reciente. ✓</p>'}</div>

}
POST.oportunidades = () => {
  let arrastrando = null;
  $$('.opp').forEach(c => { c.addEventListener('dragstart', e => { arrastrando = c.dataset.opp; e.dataTransfer.setData('text/plain', arrastrando); e.dataTransfer.effectAllowed = 'move'; }); });
  $$('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain') || arrastrando; if (id) cambiarEtapa(id, col.dataset.col); });
  });
};
async function cambiarEtapa(id, etapa) {
  const o = idx.opps.get(id); if (!o || o.etapa === etapa) return;
  o.etapa = etapa; o.ultimoMovimiento = hoy(); o.probabilidad = ETAPA[etapa].prob;
  if (etapa === 'ganada' || etapa === 'perdida') o.fechaCierre = hoy();
  guardar(); render();
  if (etapa === 'ganada') ofrecerFactura(o);
  else if (etapa === 'perdida') formOpp(id);
}
function ofrecerFactura(o) {
  if (o.asientoId && idx.asientos.get(o.asientoId)) { toast('Oportunidad ganada. Ya tiene el asiento ' + idx.asientos.get(o.asientoId).numero + '.', 'ok'); return; }
  abrirDialogo(`<div class="dhead"><h2>🎉 Oportunidad ganada</h2><button class="x" data-act="cerrar">×</button></div><div class="dbody">
    <p><b>${esc(o.titulo)}</b> — ${esc(terceroNombre(o.terceroId))} — ${fmt(o.valor)}</p>
    <p class="mt">¿Desea crear ahora el asiento de la factura de honorarios? Se abrirá el comprobante con el tercero ya diligenciado y el valor como base antes de IVA (IVA ${cfg().ivaTarifa}% y retención sugeridos, editables).</p>
    <div class="notice mt">La aplicación no emite la factura electrónica: emítala en el portal gratuito de la DIAN y aquí registre el asiento.</div></div>

ACC['nueva-opp'] = el => formOpp(null, el && el.dataset && el.dataset.ter ? { terceroId: el.dataset.ter } : null);
ACC['editar-opp'] = el => formOpp(el.dataset.id);
function formOpp(id, pre) {

ACC['tercero-desde-opp'] = () => {
  const f = $('#dlg form'), datos = { titulo: f.elements.titulo.value, servicio: f.elements.servicio.value, etapa: f.elements.etapa.value, valor: parseCOP(f.elements.valor.value), probabilidad: parseInt(f.elements.probabilidad.value) || 0, fechaCierre: parseFecha(f.elements.fechaCierre.value) || '' };
  ACC._alGuardarTercero = tid => formOpp(null, Object.assign(datos, { terceroId: tid }));
  formTercero(null, { roles: ['cliente'] });
};
FORMS.opp = function (f) {
  const g = n => f.elements[n], id = f.dataset.id, err = [];
  const terId = resolverTercero(g('tercero').value);
  const o = { terceroId: terId, titulo: g('titulo').value.trim(), servicio: g('servicio').value.trim(), etapa: g('etapa').value, valor: parseCOP(g('valor').value), probabilidad: Math.min(100, Math.max(0, parseInt(g('probabilidad').value) || 0)), fechaCierre: parseFecha(g('fechaCierre').value), motivoPerdida: g('motivoPerdida').value.trim() };
  if (!terId) err.push('Seleccione un tercero existente de la lista (o créelo primero).');
  if (!o.titulo) err.push('El título es obligatorio.');
  if (o.valor < 0) err.push('El valor no puede ser negativo.');
  if (g('fechaCierre').value.trim() && !o.fechaCierre) err.push('La fecha de cierre debe tener formato DD/MM/AAAA.');
  if (err.length) return mostrarErrores(f, err);
  let actual, cambioEtapa = false;
  if (id) { actual = idx.opps.get(id); cambioEtapa = actual.etapa !== o.etapa; Object.assign(actual, o); }
  else { actual = Object.assign({ id: uid('o'), creada: hoy(), asientoId: '' }, o); db.oportunidades.push(actual); cambioEtapa = o.etapa === 'ganada'; }
  if (cambioEtapa || !id) actual.ultimoMovimiento = hoy();
  if (id && cambioEtapa && g('probabilidad').value.trim() === f._probInicial) actual.probabilidad = ETAPA[o.etapa].prob;
  if (cambioEtapa && (o.etapa === 'ganada' || o.etapa === 'perdida') && !g('fechaCierre').value.trim()) actual.fechaCierre = hoy();
  guardar(); cerrarDialogo(); render(); toast('Oportunidad guardada.', 'ok');
  if (cambioEtapa && actual.etapa === 'ganada') ofrecerFactura(actual);
};
ACC['borrar-opp'] = async el => {
  const o = idx.opps.get(el.dataset.id);
  if (!await confirmar(`¿Eliminar la oportunidad “${o.titulo}”? Sus interacciones quedarán sin oportunidad asociada. Los asientos contables no se modifican.`, 'Eliminar')) return;
  db.oportunidades = db.oportunidades.filter(x => x.id !== o.id); for (const i of db.interacciones) if (i.oportunidadId === o.id) i.oportunidadId = ''; for (const k of db.tareas) if (k.oportunidadId === o.id) k.oportunidadId = '';
  for (const a of db.asientos) if (a.oportunidadId === o.id) a.oportunidadId = '';
  guardar(); cerrarDialogo(); render();
};

/* ---------- Interacciones ---------- */

FORMS.int = function (f) {

/* =====================================================================
   ASIENTOS CONTABLES (partida doble)
   ===================================================================== */
function listaAsientos() {
  const q = filtro('asientos', 'q').toLowerCase(), tp = filtro('asientos', 'tipo');
  const d = parseFecha(filtro('asientos', 'desde')), h = parseFecha(filtro('asientos', 'hasta'));
  const l = db.asientos.filter(a => (!tp || a.tipo === tp) && (!d || a.fecha >= d) && (!h || a.fecha <= h) && (!q || (a.numero + ' ' + a.concepto + ' ' + terceroNombre(a.terceroId) + ' ' + terceroDoc(a.terceroId)).toLowerCase().includes(q)))
    .sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : a.numero < b.numero ? 1 : -1);
  if (!l.length) return tablaVacia(db.asientos.length ? 'Ningún asiento coincide con los filtros.' : 'Todavía no hay asientos. Use “Nuevo asiento”.');
  return `<div class="tablewrap"><table class="t"><thead><tr><th>Fecha</th><th>Comprobante</th><th>Tipo</th><th>Tercero</th><th>Concepto</th><th class="r">Valor</th></tr></thead><tbody>${l.slice(0, 500).map(a => `<tr class="click" data-act="editar-asiento" data-id="${a.id}"><td>${fmtFecha(a.fecha)}</td><td><b>${esc(a.numero)}</b></td><td>${esc(TIPOS_COMP[a.tipo] || a.tipo)}</td><td>${nombreTerc(a.terceroId)}</td><td>${esc(a.concepto)}</td><td class="r">${fmtNum(totalAsiento(a))}</td></tr>`).join('')}</tbody></table></div><p class="muted small mt">${l.length} asiento(s)${l.length > 500 ? ' — se muestran los primeros 500; use los filtros' : ''}. Total de valores: ${fmt(sum(l, totalAsiento))}</p>`;
}

function aCSV(filas, delim) {
  const q = v => {
    if (v == null) return '';
    let s = typeof v === 'number' ? String(Math.round(v)) : String(v);
    if (typeof v === 'string' && /^[=+@\t\r]/.test(s)) s = "'" + s;
    return (s.includes(delim) || /["\r\n]/.test(s)) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '﻿' + filas.map(r => r.map(q).join(delim)).join('\r\n') + '\r\n';
}
const delimElegido = () => (ui.f.exportar && ui.f.exportar.delim) || ';';
function bajarCSV(nombre, filas) { descargar(nombre, aCSV(filas, delimElegido()), 'text/csv;charset=utf-8'); toast(`${nombre} descargado (${Math.max(0, filas.length - 1)} filas).`, 'ok'); }

ACC['calendario'] = el => { const w = el.closest('.fecha-wrap'), t = $('input.fecha', w), h = $('.calh', w); const v = parseFecha(t.value); if (v) h.value = v; try { h.showPicker(); } catch (e) { h.focus(); h.click(); } };
ACC['borrar-ejemplo'] = async () => {
  if (await confirmar('Se eliminarán todos los datos de ejemplo (terceros, asientos, oportunidades, interacciones, tareas y extracto). Lo que usted haya creado se conserva.', 'Borrar datos de ejemplo')) { borrarEjemplo(); render(); toast('Datos de ejemplo borrados. Ya puede empezar con sus datos.', 'ok'); }
};
ACC['cargar-ejemplo'] = async () => { if (await confirmar('Esto reemplaza TODOS los datos actuales por los de ejemplo. ¿Continuar?', 'Reemplazar')) { const cfgPrev = cfg(); crearDatosEjemplo(); guardar(); render(); } };
ACC['borrar-todo'] = async () => {
  if (!await confirmar('Se borrarán TODOS los terceros, asientos, oportunidades, interacciones, tareas y extractos. Se conserva el catálogo de cuentas y la configuración.', 'Continuar')) return;
  if (!await confirmar('¿Está completamente seguro? Descargue antes un JSON si no tiene respaldo. Esta acción no se puede deshacer.', 'Sí, borrar todo')) return;
  Object.assign(db, { terceros: [], asientos: [], oportunidades: [], interacciones: [], tareas: [], extractos: [], ejemplo: false }); cfg().consecutivos = {}; guardar(); render(); toast('Datos borrados.');
};

/* =====================================================================
   EVENTOS GLOBALES
   ===================================================================== */
Object.assign(VISTAS, { tablero: vTablero, terceros: vTerceros, oportunidades: vOportunidades, interacciones: vInteracciones, tareas: vTareas, asientos: vAsientos, conciliacion: vConciliacion, reportes: vReportes, cuentas: vCuentas, exportar: vExportar, config: vConfig });
Object.assign(LISTAS, { terceros: listaTerceros, interacciones: listaInteracciones, tareas: listaTareas, asientos: listaAsientos, cuentas: listaCuentas });
const CHG = {
  'mover-opp': el => cambiarEtapa(el.dataset.id, el.value),
  'toggle-tarea': el => { const k = db.tareas.find(x => x.id === el.dataset.id); k.hecha = el.checked; guardar(); render(); },
};
document.addEventListener('click', e => {
  const ir = e.target.closest('[data-ir]'); if (ir) { e.preventDefault(); irA(ir.dataset.ir); return; }
  const tb = e.target.closest('[data-rep-tab]'); if (tb) { ui.rep.tab = tb.dataset.repTab; render(); return; }
  const a = e.target.closest('[data-act]');
  if (a && ACC[a.dataset.act]) { if (a.tagName === 'A') e.preventDefault(); ACC[a.dataset.act](a, e); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  try { FORMS[f.dataset.form](f, e); } catch (err) { console.error(err); toast('Error inesperado: ' + err.message, 'error'); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches && t.matches('input.fecha') && e.inputType && e.inputType.startsWith('insert')) {
    const m = t.value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) t.value = `${m[3]}/${m[2]}/${m[1]}`;
    else { const d = t.value.replace(/\D/g, '').slice(0, 8); t.value = d.length > 4 ? d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4) : d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; }
  }
  if (t.dataset.filtro !== undefined) {
    const v = ui.vista; (ui.f[v] = ui.f[v] || {})[t.dataset.filtro] = t.value;
    if (LISTAS[v]) { const l = $('#lista'); if (l) l.innerHTML = LISTAS[v](); }
  }
  if (t.dataset.rep !== undefined) {
    const k = t.dataset.rep;
    if (k === 'desde' || k === 'hasta') { const iso = parseFecha(t.value); if (!iso || t.value.length < 10) return; ui.rep[k] = iso; } else ui.rep[k] = t.value;
    $('#rep-cuerpo').innerHTML = cuerpoReporte();
  }
  if (t.dataset.conc !== undefined) { const k = t.dataset.conc; ui.conc[k] = t.type === 'checkbox' ? t.checked : t.value; ui.conc.selExt = ui.conc.selLib = null; refrescarConc(); }
  if (t.name === 'documento' && t.closest('form[data-form="tercero"]')) actualizarDV(t.closest('form'));
  const f = t.closest && t.closest('form[data-form="asiento"]');
  if (f) {
    if (t.classList.contains('l-deb') && parseCOP(t.value) > 0) $('.l-cre', t.closest('tr')).value = '';
    if (t.classList.contains('l-cre') && parseCOP(t.value) > 0) $('.l-deb', t.closest('tr')).value = '';
    if (['w_base', 'w_ivap', 'w_retep'].includes(t.name)) wizardAplicar();
    recalcAsiento();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.actChange && CHG[t.dataset.actChange]) return CHG[t.dataset.actChange](t);
  if (t.classList.contains('calh')) { const w = t.closest('.fecha-wrap'), x = $('input.fecha', w); x.value = fmtFecha(t.value); x.dispatchEvent(new Event('input', { bubbles: true })); return; }
  if (t.dataset.cfg !== undefined) {
    const k = t.dataset.cfg, c = cfg();
    if (k === 'servicios') c.servicios = t.value.split('\n').map(s => s.trim()).filter(Boolean);
    else if (k === 'empresaNombre') c.empresa.nombre = t.value.trim();
    else if (k === 'empresaNit') c.empresa.nit = t.value.trim();
    else { const n = parseFloat(String(t.value).replace(',', '.')); if (isNaN(n) || n < 0) { toast('Valor no válido.', 'error'); t.value = c[k]; return; } c[k] = n; }
    guardar(); toast('Configuración guardada.', 'ok'); return;
  }
  if (t.dataset.cfgAuto) { cfg().cuentasAuto[t.dataset.cfgAuto] = t.value; guardar(); toast('Configuración guardada.', 'ok'); return; }
  if (t.dataset.filtro === 'delim' || t.closest('#dlg') === null && t.dataset.filtro !== undefined && ui.vista === 'exportar') { (ui.f.exportar = ui.f.exportar || {})[t.dataset.filtro] = t.value; }
  if (t.name === 'tipoDoc' && t.closest('form[data-form="tercero"]')) actualizarDV(t.closest('form'));
  const f = t.closest && t.closest('form[data-form="asiento"]');
  if (f) {
    if (t.name === 'w_modo') {
      const modo = t.value; if (modo) { f.elements.w_cuenta.innerHTML = opcionesCuentaBase(modo, modo === 'venta' ? cfg().cuentasAuto.ingresos : cfg().cuentasAuto.gastoHonorarios); $('#w_rete_l').textContent = modo === 'compra' ? 'Retención que practicamos' : 'Retención que nos practican'; wizardAplicar(); }
    } else if (['w_iva', 'w_rete', 'w_cuenta'].includes(t.name)) wizardAplicar();
    else if (t.name === 'tipo' && !f.dataset.id && f.elements.numero.value === f.dataset.sugerido) { const n = siguienteNumero(t.value); f.elements.numero.value = n; f.dataset.sugerido = n; }
  }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (t.classList && (t.classList.contains('l-deb') || t.classList.contains('l-cre') || t.name === 'w_base' || t.name === 'valor')) { const v = parseCOP(t.value); t.value = v ? fmtNum(v) : ''; }
});
$('#file-json').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  const texto = await file.text();
  let o; try { o = JSON.parse(texto.replace(/^﻿/, '')); normalizar(o); } catch (err) { toast(err.message.includes('respaldo') ? err.message : 'El archivo no es un JSON válido de CG Finance.', 'error'); return; }
  const hayDatos = db.asientos.length || db.terceros.length;
  if (hayDatos && !db.ejemplo && !await confirmar(`Se reemplazarán los datos actuales por los del archivo (${o.asientos ? o.asientos.length : 0} asientos, ${o.terceros ? o.terceros.length : 0} terceros). ¿Continuar?`, 'Importar')) return;
  await importarTexto(texto, false);
});
$('#file-csv').addEventListener('change', async e => {
  const file = e.target.files[0]; if (!file) return;
  abrirImportExtracto(file.name, decodificar(await file.arrayBuffer()));
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VISTAS[v] && v !== ui.vista) { ui.vista = v; render(); } });
document.addEventListener('dialogclose', () => { }, true);

/* ---------- Arranque ---------- */
async function iniciar() {
  try {
    const g = await Almacen.leer();
    if (g) db = normalizar(g); else { crearDatosEjemplo(); await Almacen.escribir(db); }
  } catch (e) { console.error(e); db = dbVacia(); toast('No se pudieron leer los datos guardados: ' + e.message, 'error'); }
  reindexar(); actualizarListas();
  const v = location.hash.slice(1); ui.vista = VISTAS[v] ? v : 'tablero';
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  render();
  await Respaldo.iniciar();
}
iniciar();

</script>
</body>
</html>
